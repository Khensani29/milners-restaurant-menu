starters:
  - name: Something Light
    description: Crisp Onion Rings battered and fried until crunchy.
    price: R50
    image: ""
    dietary: Vegetarian
  - name: Soup of the Day
    description: Our Soup of the Day is suitable for those following a Vegetarian
      diet. Please ask your waiter what the Chef has prepared today. Served with
      a fresh bread roll and butter.
    price: R75
    image: ""
    dietary: Vegetarian
  - name: Smoked Trout, and Friends
    description: This is a flavor vibrant salad of local smoked trout, tangy pickled
      cucumber, and sweet-piquant peppadews. Served with buttered, sliced brown
      bread.
    price: R120
    image: ""
    dietary: ""
  - name: Sweet Potato Waffle
    description: Made with oats, flour, almond milk and applesauce, baked in the
      iron and then topped with black beans, tomatoes, radishes, sriracha and
