    price: R125
    image: ""
    dietary: "Vegan "
salads:
  - name: Tabbouleh
    description: This refreshing Mediterranean dish is crisp, vibrant, nutritious
      and perfect as a light, healthy meal. Packed with parsley, bulgur wheat,
      chopped tomatoes and diced onion, it is brought to life by a bright, zesty
      lemon-olive oil dressing.
    price: R80
    image: ""
    dietary: Vegan
  - name: Greek Salad
    description: A rustic dish featuring ripe tomato wedges, diced cucumber, sliced
      red onion, feta cheese and olives. Topped with garlic croutons and dressed
      with Balsamic vinegar and olive oil.
    price: R105
    image: ""
    dietary: Vegetarian
  - name: The Kedgeree Salad
    description: Flaked smoked haddock with sliced, lightly boiled egg, fresh herbs
      and roasted pumpkin seeds. Served on a bed of shredded lettuce and dressed
      with a simple fresh lime and olive oil vinaigrette.
    price: R125
    image: ""
    dietary: ""
pasta:
