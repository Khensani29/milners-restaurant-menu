<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Milner's Restaurant</title>

<link rel="icon" type="image/png" href="/images/favicon.png.png">
<link rel="apple-touch-icon" href="/images/favicon.png.png">
    
<script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>

<style>
    :root {
        --primary: #26362c;
        --secondary: #c9bfae;
        --background: #f7f3ed;
        --text: #29251f;
        --muted: #5f5a52;
    }

    * {
        box-sizing: border-box;
    }

    html {
        scroll-behavior: smooth;
    }

    body {
        margin: 0;
        background: var(--background);
        color: var(--text);
        font-family: Georgia, "Times New Roman", serif;
    }

    .hero {
        position: relative;
        min-height: 320px;
        background: var(--primary);
        color: white;
        display: flex;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 45px 20px;
        background-size: cover;
        background-position: center;
    }

    .hero::before {
        content: "";
        position: absolute;
        inset: 0;
        background: rgba(0,0,0,0.32);
        display: none;
    }

    .hero.has-image::before {
        display: block;
    }

    .hero-content {
        position: relative;
        z-index: 1;
        max-width: 700px;
    }

    .logo {
        display: none;
        max-width: 150px;
        max-height: 100px;
        margin: 0 auto 25px;
        object-fit: contain;
    }

    .restaurant-name {
        margin: 0;
        font-size: clamp(34px, 7vw, 58px);
        font-weight: normal;
        line-height: 1.1;
    }

    .tagline {
        margin: 14px 0 0;
        font-family: Arial, sans-serif;
        font-size: 14px;
        letter-spacing: 2px;
        text-transform: uppercase;
    }

    .intro {
        max-width: 680px;
        margin: 0 auto;
        padding: 35px 22px 15px;
        text-align: center;
        white-space: pre-line;
        font-family: Arial, sans-serif;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.7;
    }

    main {
        max-width: 820px;
        margin: 0 auto;
        padding: 0 20px 70px;
    }

    .menu-nav {
        position: sticky;
        top: 0;
        z-index: 10;
        background: var(--background);
        padding: 15px 0;
        border-bottom: 1px solid var(--secondary);
        overflow-x: auto;
        white-space: nowrap;
        scrollbar-width: none;
    }

    .menu-nav::-webkit-scrollbar {
        display: none;
    }

    .menu-nav a {
        color: var(--primary);
        text-decoration: none;
        font-family: Arial, sans-serif;
        font-size: 12px;
        letter-spacing: 1.2px;
        text-transform: uppercase;
        margin-right: 22px;
    }

    section {
        scroll-margin-top: 65px;
        padding-top: 42px;
    }

    section h2 {
        margin: 0 0 10px;
        padding-bottom: 13px;
        border-bottom: 1px solid var(--secondary);
        color: var(--primary);
        font-size: 28px;
        font-weight: normal;
    }

    .menu-item {
        padding: 22px 0;
        border-bottom: 1px solid color-mix(in srgb, var(--secondary) 45%, transparent);
    }

    .item-header {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        gap: 20px;
    }

    .menu-item h3 {
        margin: 0;
        font-size: 19px;
        font-weight: normal;
        line-height: 1.35;
    }

    .price {
        color: var(--primary);
        font-family: Arial, sans-serif;
        font-size: 15px;
        font-weight: bold;
        white-space: nowrap;
    }

    .description {
        margin: 8px 0 0;
        color: var(--muted);
        font-family: Arial, sans-serif;
        font-size: 13px;
        line-height: 1.65;
    }

    .dietary {
        display: inline-block;
        margin-top: 10px;
        color: var(--primary);
        border: 1px solid var(--secondary);
        padding: 4px 8px;
        border-radius: 20px;
        font-family: Arial, sans-serif;
        font-size: 9px;
        letter-spacing: 0.8px;
        text-transform: uppercase;
    }

    .section-banner {
        width: 100%;
        height: clamp(230px, 38vw, 340px);
        object-fit: cover;
        object-position: center;
        display: block;
        margin: 18px 0 8px;
        border-radius: 12px;
    }

    .section-banner-placeholder {
        width: 100%;
        height: clamp(230px, 38vw, 340px);
        margin: 18px 0 8px;
        border: 2px dashed var(--secondary);
        border-radius: 12px;
        background: color-mix(
            in srgb,
            var(--secondary) 15%,
            var(--background)
        );
        color: var(--muted);
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: Arial, sans-serif;
        font-size: 13px;
        letter-spacing: 1px;
        text-transform: uppercase;
    }
    .dish-image {
        width: 100%;
        max-height: 340px;
        object-fit: cover;
        margin: 16px 0 2px;
        border-radius: 4px;
        display: block;
    }
    .social-section {
        margin-top: 55px;
        padding: 30px 10px;
        border-top: 1px solid var(--secondary);
        text-align: center;
    }

    .social-title {
        margin: 0 0 20px;
        color: var(--primary);
        font-family: Arial, sans-serif;
        font-size: 13px;
        font-weight: bold;
        letter-spacing: 1.5px;
        text-transform: uppercase;
    }

    .social-links {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
    }

    .social-item {
        min-width: 0;
        padding: 12px 6px;
        border: 1px solid var(--secondary);
        border-radius: 12px;
        color: var(--primary);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 7px;
        font-family: Arial, sans-serif;
        font-size: 10px;
        line-height: 1.4;
        overflow-wrap: anywhere;
        text-decoration: none;
        transition: background-color 0.2s ease, color 0.2s ease,
            transform 0.2s ease;
    }

    .social-icon {
        display: block;
        width: 22px;
        height: 22px;
    }

    .social-icon svg {
        display: block;
        width: 100%;
        height: 100%;
    }

    .social-item:hover,
    .social-item:focus-visible {
        background: var(--primary);
        color: white;
        transform: translateY(-2px);
        outline: none;
    }

    footer {
        background: var(--primary);
        color: white;
        text-align: center;
        padding: 32px 20px;
        font-family: Arial, sans-serif;
        font-size: 12px;
        line-height: 1.5;
    }

    .loading {
        text-align: center;
        padding: 80px 20px;
        font-family: Arial, sans-serif;
        color: var(--muted);
    }

    @media (max-width: 600px) {
        .hero {
            min-height: 270px;
            padding: 35px 18px;
        }

        .logo {
            max-width: 120px;
            max-height: 80px;
        }

        main {
            padding-left: 16px;
            padding-right: 16px;
        }

        section {
            padding-top: 35px;
        }

        .item-header {
            gap: 12px;
        }

        .menu-item h3 {
            font-size: 17px;
        }

        .description {
            font-size: 13px;
        }

        .dish-image {
            max-height: 260px;
        }
    }
</style>
</head>

<body>

<header class="hero" id="hero">
    <div class="hero-content">
        <img id="logo" class="logo" alt="Restaurant logo">
        <h1 class="restaurant-name" id="restaurant-name">Milner's Restaurant</h1>
        <p class="tagline" id="tagline"></p>
    </div>
</header>

<div class="intro" id="intro"></div>

<main>
    <nav class="menu-nav" id="menu-nav"></nav>

    <div id="menu">
        <div class="loading">Loading menu...</div>
    </div>

    <div class="social-section">
        <p class="social-title">Follow us</p>

        <div class="social-links">
            <a class="social-item"
               href="https://www.instagram.com/holidayinnsunnysidepark/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Open Holiday Inn Sunnyside Park Hotel on Instagram">
                <span class="social-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img">
                        <rect x="3" y="3" width="18" height="18" rx="5"
                              fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="12" cy="12" r="4"
                                fill="none" stroke="currentColor" stroke-width="2"/>
                        <circle cx="17.5" cy="6.5" r="1.1" fill="currentColor"/>
                    </svg>
                </span>
                <span>Holiday Inn JHB Sunnyside Park</span>
            </a>

            <a class="social-item"
               href="https://www.facebook.com/HolidayInnJohannesburgSunnysidePark/"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Open Holiday Inn Johannesburg Sunnyside Park on Facebook">
                <span class="social-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img">
                        <path fill="currentColor"
                              d="M13.6 21v-8h2.8l.4-3h-3.2V8.1c0-.9.3-1.5 1.7-1.5H17V4a24 24 0 0 0-2.5-.2c-2.5 0-4.2 1.5-4.2 4.3V10H7.5v3h2.8v8h3.3Z"/>
                    </svg>
                </span>
                <span>Holiday Inn Johannesburg Sunnyside Park Hotel</span>
            </a>

            <a class="social-item"
               href="https://www.tiktok.com/@holidayinnsunnysidepark"
               target="_blank"
               rel="noopener noreferrer"
               aria-label="Open Holiday Inn Sunnyside Park on TikTok">
                <span class="social-icon" aria-hidden="true">
                    <svg viewBox="0 0 24 24" role="img">
                        <path fill="currentColor"
                              d="M15 3c.4 2.1 1.7 3.4 3.8 3.6v3A8.6 8.6 0 0 1 15 8.5v6.2a6 6 0 1 1-5.2-5.9v3.1a3 3 0 1 0 2.2 2.8V3h3Z"/>
                    </svg>
                </span>
                <span>Holiday Inn Sunnyside Park hotel</span>
            </a>
        </div>
    </div>
</main>

<footer id="footer"></footer>
    
<script>
    const sectionNames = {
        starters: "Starters",
        salads: "Salads",
        pasta: "Pasta",
        mains: "Mains",
        desserts: "Desserts"
    };

    const picturePositions = {
        starters: {
            field: "top_image",
            label: "Main menu picture"
        },
        pasta: {
            field: "middle_image",
            label: "Pasta and mains picture"
        },
        desserts: {
            field: "bottom_image",
            label: "Dessert picture"
        }
    };

    function safeText(value) {
        return value ?? "";
    }

    async function loadYaml(path) {
        const response = await fetch(path + "?v=" + Date.now());

        if (!response.ok) {
            throw new Error("Could not load " + path);
        }

        const text = await response.text();
        return jsyaml.load(text);
    }

    function applySettings(settings) {
        const root = document.documentElement;

        if (settings.primary_colour) {
            root.style.setProperty("--primary", settings.primary_colour);
        }

        if (settings.secondary_colour) {
            root.style.setProperty("--secondary", settings.secondary_colour);
        }

        if (settings.background_colour) {
            root.style.setProperty("--background", settings.background_colour);
        }

        if (settings.text_colour) {
            root.style.setProperty("--text", settings.text_colour);
        }

        if (settings.muted_text_colour) {
            root.style.setProperty("--muted", settings.muted_text_colour);
        }

        const restaurantName =
            settings.restaurant_name || "Milner's Restaurant";

        document.getElementById("restaurant-name").textContent =
            restaurantName;

        document.title = restaurantName;

        const tagline = document.getElementById("tagline");

        if (settings.tagline) {
            tagline.textContent = settings.tagline;
            tagline.style.display = "block";
        } else {
            tagline.style.display = "none";
        }

        const intro = document.getElementById("intro");

        if (settings.intro_text) {
            intro.textContent = settings.intro_text;
            intro.style.display = "block";
        } else {
            intro.style.display = "none";
        }

        const logo = document.getElementById("logo");

        if (settings.logo) {
            logo.src = settings.logo;
            logo.style.display = "block";
        }

        const hero = document.getElementById("hero");

        if (settings.hero_image) {
            hero.style.backgroundImage =
                `url("${settings.hero_image}")`;

            hero.classList.add("has-image");
        }

        document.getElementById("footer").textContent =
            settings.footer_text || restaurantName;
    }

    function createNavigation(menu) {
        const nav = document.getElementById("menu-nav");
        nav.innerHTML = "";

        Object.keys(sectionNames).forEach(key => {
            if (!Array.isArray(menu[key]) || menu[key].length === 0) {
                return;
            }

            const link = document.createElement("a");
            link.href = "#" + key;
            link.textContent = sectionNames[key];

            nav.appendChild(link);
        });
    }

    function createMenu(menu) {
        const menuContainer = document.getElementById("menu");
        menuContainer.innerHTML = "";

        Object.keys(sectionNames).forEach(key => {
            const items = menu[key];

            if (!Array.isArray(items) || items.length === 0) {
                return;
            }

            const section = document.createElement("section");
            section.id = key;

            const picturePosition = picturePositions[key];

            if (picturePosition) {
                const picturePath = menu[picturePosition.field];

                if (picturePath) {
                    const banner = document.createElement("img");
                    banner.className = "section-banner";
                    banner.src = picturePath;
                    banner.alt = picturePosition.label;
                    banner.loading = "lazy";
                    section.appendChild(banner);
                } else {
                    const placeholder = document.createElement("div");
                    placeholder.className =
                        "section-banner-placeholder";
                    placeholder.textContent =
                        picturePosition.label;
                    section.appendChild(placeholder);
                }
            }

            const heading = document.createElement("h2");
            heading.textContent = sectionNames[key];
            section.appendChild(heading);
            
            items.forEach(item => {
                const menuItem = document.createElement("article");
                menuItem.className = "menu-item";

                const itemHeader = document.createElement("div");
                itemHeader.className = "item-header";

                const name = document.createElement("h3");
                name.textContent = safeText(item.name);

                const price = document.createElement("span");
                price.className = "price";
                price.textContent = safeText(item.price);

                itemHeader.appendChild(name);
                itemHeader.appendChild(price);

                menuItem.appendChild(itemHeader);

                if (item.description) {
                    const description = document.createElement("p");
                    description.className = "description";
                    description.textContent = item.description;
                    menuItem.appendChild(description);
                }

                if (item.dietary) {
                    const dietary = document.createElement("span");
                    dietary.className = "dietary";
                    dietary.textContent = item.dietary;
                    menuItem.appendChild(dietary);
                }

                if (item.image) {
                    const image = document.createElement("img");
                    image.className = "dish-image";
                    image.src = item.image;
                    image.alt = safeText(item.name);
                    image.loading = "lazy";
                    menuItem.appendChild(image);
                }

                section.appendChild(menuItem);
            });

            menuContainer.appendChild(section);
        });
    }

    async function initialiseSite() {
        try {
            const [settings, menu] = await Promise.all([
                loadYaml("/content/settings.yml"),
                loadYaml("/content/menu.yml")
            ]);

            applySettings(settings || {});
            createNavigation(menu || {});
            createMenu(menu || {});

        } catch (error) {
            console.error(error);

            document.getElementById("menu").innerHTML =
                '<div class="loading">The menu could not be loaded. Please refresh the page.</div>';
        }
    }

    initialiseSite();
</script>

</body>
</html>
